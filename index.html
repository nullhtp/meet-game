<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Поближе">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Поближе — вопросы, чтобы узнать друг друга</title>
<style>
  :root{
    --bg1:#1a1530; --bg2:#2a1d4a; --bg3:#0f0b1f;
    --ink:#f4f1fb; --muted:rgba(244,241,251,.62);
    --card-radius:28px;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(255,120,180,.20), transparent 60%),
      radial-gradient(1000px 600px at 0% 110%, rgba(80,200,255,.18), transparent 55%),
      linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));
    background-attachment:fixed;
    overflow:hidden;
    user-select:none; -webkit-user-select:none;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
    -webkit-touch-callout:none;
    position:fixed; inset:0; width:100%;
  }
  .app{
    height:100vh;        /* запасной вариант для старых браузеров */
    height:100dvh;       /* учитывает адресную строку, которая прячется */
    display:flex; flex-direction:column;
    padding:calc(var(--safe-t) + 14px) max(18px, env(safe-area-inset-left)) calc(var(--safe-b) + 16px) max(18px, env(safe-area-inset-right));
    max-width:560px; margin:0 auto;
  }

  /* ---------- Header ---------- */
  header{display:flex; align-items:center; justify-content:space-between; gap:10px; flex:0 0 auto;}
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:.2px;}
  .brand .dot{width:11px; height:11px; border-radius:50%;
    background:linear-gradient(135deg,#ff7ab0,#7ad7ff); box-shadow:0 0 16px rgba(255,122,176,.7);}
  .brand h1{font-size:18px; margin:0;}
  .iconbtn{
    appearance:none; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06);
    color:var(--ink); width:42px; height:42px; border-radius:14px; font-size:18px;
    display:grid; place-items:center; cursor:pointer; backdrop-filter:blur(8px);
    transition:transform .15s ease, background .2s;
  }
  .iconbtn:active{transform:scale(.92);}

  /* ---------- Category chips ---------- */
  .chips{display:flex; gap:8px; overflow-x:auto; padding:14px 2px 4px; margin:0 -2px;
    flex:0 0 auto; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.05);
    color:var(--ink); padding:9px 14px; border-radius:999px; font-size:13.5px; font-weight:600;
    cursor:pointer; white-space:nowrap; transition:transform .12s, border-color .2s, background .2s;
    display:flex; align-items:center; gap:6px;
  }
  .chip:active{transform:scale(.95);}
  .chip[aria-pressed="true"]{
    background:var(--c-soft,rgba(255,255,255,.18));
    border-color:var(--c,rgba(255,255,255,.5));
    box-shadow:0 4px 18px var(--c-glow,transparent);
  }

  /* ---------- Card stack ---------- */
  .stage{flex:1 1 auto; position:relative; display:grid; place-items:center; min-height:0; margin:6px 0;}
  .deck{position:relative; width:100%; height:100%; max-height:560px; display:grid; place-items:center;}
  .card{
    position:absolute; width:100%; height:100%;
    border-radius:var(--card-radius);
    background:linear-gradient(165deg,#ffffff,#f3efff);
    color:#1c1530;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.4) inset;
    display:flex; flex-direction:column; padding:26px 24px;
    will-change:transform, opacity; touch-action:none;
  }
  .card.behind1{transform:scale(.93) translateY(20px); filter:brightness(.9); pointer-events:none;}
  .card.behind2{transform:scale(.86) translateY(40px); filter:brightness(.8); pointer-events:none;}
  .card .top{display:flex; align-items:center; justify-content:space-between;}
  .card .cat{font-size:13px; font-weight:800; letter-spacing:.4px; text-transform:uppercase;
    display:flex; align-items:center; gap:7px;}
  .card .cat .blob{width:12px; height:12px; border-radius:50%; background:var(--c,#888);}
  .card .num{font-size:12.5px; font-weight:700; color:rgba(28,21,48,.45);}
  .card .q{
    flex:1 1 auto; display:flex; align-items:center;
    font-size:clamp(21px,5.6vw,29px); font-weight:700; line-height:1.32; letter-spacing:-.2px;
  }
  .card .hint{font-size:12.5px; color:rgba(28,21,48,.42); font-weight:600; text-align:center;}
  .card .accent{height:5px; border-radius:999px; background:var(--c,#888); width:46px; margin-bottom:16px; opacity:.9;}

  .turn{
    flex:0 0 auto; text-align:center; min-height:22px; margin:2px 0 10px;
    font-size:14px; color:var(--muted); font-weight:600;
  }
  .turn b{color:var(--ink);}

  /* ---------- Controls ---------- */
  .controls{flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:16px;}
  .round{
    appearance:none; border:none; cursor:pointer; border-radius:50%;
    display:grid; place-items:center; color:var(--ink);
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16);
    backdrop-filter:blur(8px); transition:transform .14s ease, background .2s;
  }
  .round:active{transform:scale(.9);}
  .round.sm{width:54px; height:54px; font-size:20px;}
  .next{
    width:78px; height:78px; font-size:30px;
    background:linear-gradient(135deg,#ff7ab0,#a06bff 55%,#7ad7ff);
    box-shadow:0 14px 34px -8px rgba(160,107,255,.7); border:none;
  }
  .progress{flex:0 0 auto; text-align:center; font-size:12.5px; color:var(--muted); margin-top:12px;}
  .progress .bar{height:4px; border-radius:999px; background:rgba(255,255,255,.12); margin-top:8px; overflow:hidden;}
  .progress .bar i{display:block; height:100%; width:0; border-radius:999px;
    background:linear-gradient(90deg,#ff7ab0,#7ad7ff); transition:width .35s ease;}

  /* ---------- Sheet (players) ---------- */
  .scrim{position:fixed; inset:0; background:rgba(8,5,18,.6); backdrop-filter:blur(4px);
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:20;}
  .scrim.show{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:21;
    background:linear-gradient(180deg,#241a40,#1a1430);
    border-radius:26px 26px 0 0; padding:20px 20px calc(var(--safe-b) + 22px);
    transform:translateY(110%); transition:transform .32s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -20px 50px rgba(0,0,0,.5); max-width:560px; margin:0 auto;
  }
  .sheet.show{transform:translateY(0);}
  .sheet h2{margin:6px 0 4px; font-size:19px;}
  .sheet p.sub{margin:0 0 16px; color:var(--muted); font-size:13.5px;}
  .grip{width:42px; height:5px; border-radius:999px; background:rgba(255,255,255,.25); margin:0 auto 14px;}
  .players{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .ptag{display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.14); padding:8px 10px 8px 13px; border-radius:999px; font-weight:600; font-size:14px;}
  .ptag button{appearance:none; border:none; background:rgba(255,255,255,.12); color:var(--ink);
    width:22px; height:22px; border-radius:50%; cursor:pointer; font-size:14px; line-height:1;}
  .addrow{display:flex; gap:8px;}
  .addrow input{flex:1; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16);
    color:var(--ink); border-radius:14px; padding:13px 15px; font-size:16px; outline:none;}
  .addrow input::placeholder{color:rgba(244,241,251,.4);}
  .btn{appearance:none; border:none; cursor:pointer; font-weight:700; font-size:15px; border-radius:14px;
    padding:13px 18px; color:#1c1530; background:linear-gradient(135deg,#ff9ec6,#9ad6ff);}
  .btn.ghost{background:rgba(255,255,255,.08); color:var(--ink); border:1px solid rgba(255,255,255,.16);}
  .sheet .actions{display:flex; gap:10px; margin-top:18px;}
  .sheet .actions .btn{flex:1;}
  .toggle{display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
    padding:13px 15px; border-radius:14px; margin-bottom:14px;}
  .toggle span{font-size:14.5px; font-weight:600;}
  .switch{position:relative; width:50px; height:30px; flex:0 0 auto;}
  .switch input{opacity:0; width:100%; height:100%; margin:0; cursor:pointer;}
  .switch .track{position:absolute; inset:0; border-radius:999px; background:rgba(255,255,255,.18); transition:.2s;}
  .switch .knob{position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%;
    background:#fff; transition:.2s;}
  .switch input:checked + .track{background:linear-gradient(135deg,#ff7ab0,#7ad7ff);}
  .switch input:checked + .track + .knob{transform:translateX(20px);}
  .freshrow{display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
    padding:11px 14px; border-radius:14px; margin-bottom:4px;}
  .freshrow span{font-size:13.5px; color:var(--muted); font-weight:600;}
  .btn.sm{padding:9px 12px; font-size:13px; border-radius:11px; flex:0 0 auto;}

  .fade-enter{animation:cardIn .42s cubic-bezier(.2,.85,.25,1) both;}
  @keyframes cardIn{from{opacity:0; transform:scale(.9) translateY(26px);} to{opacity:1; transform:none;}}

  .empty{text-align:center; color:rgba(28,21,48,.7);}
  .empty .big{font-size:42px; margin-bottom:6px;}

  /* ---------- Невысокие экраны (компактные телефоны) ---------- */
  @media (max-height:680px){
    .app{padding-top:calc(var(--safe-t) + 9px);}
    .chips{padding:10px 2px 2px;}
    .card{padding:22px 20px;}
    .card .q{font-size:clamp(18px,5vw,25px);}
    .next{width:68px; height:68px; font-size:26px;}
    .round.sm{width:50px; height:50px; font-size:18px;}
    .progress{margin-top:8px;}
  }
  /* ---------- Очень низкие / ландшафт: убираем лишнее ---------- */
  @media (max-height:560px), (orientation:landscape){
    .turn{margin:0 0 4px;}
    .card .hint{display:none;}
    .card .accent{margin-bottom:10px;}
    .deck{max-height:none;}
    .next{width:60px; height:60px; font-size:24px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important; transition-duration:.05ms !important;}
  }

  /* убирает двойной-тап-зум и 300мс задержку нажатия на iOS */
  .app,.iconbtn,.chip,.round,.btn,.stage,.controls,.turn,.progress{touch-action:manipulation;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="dot"></span><h1>Поближе</h1></div>
    <button class="iconbtn" id="openSheet" aria-label="Игроки и настройки">⚙️</button>
  </header>

  <div class="chips" id="chips"></div>

  <div class="turn" id="turn"></div>

  <div class="stage">
    <div class="deck" id="deck"></div>
  </div>

  <div class="controls">
    <button class="round sm" id="prev" aria-label="Назад">↩︎</button>
    <button class="round next" id="next" aria-label="Следующий вопрос">→</button>
    <button class="round sm" id="shuffle" aria-label="Перемешать">🔀</button>
  </div>

  <div class="progress">
    <span id="progressText">0 / 0</span>
    <div class="bar"><i id="progressBar"></i></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Настройки">
  <div class="grip"></div>
  <h2>Настройки игры</h2>
  <p class="sub">Передавайте ход по именам, а вопросы — не повторяйте от встречи к встрече.</p>

  <div class="toggle">
    <span>Не повторять вопросы между встречами</span>
    <label class="switch">
      <input type="checkbox" id="noRepeat">
      <span class="track"></span><span class="knob"></span>
    </label>
  </div>

  <div class="toggle">
    <span>Ходить по очереди</span>
    <label class="switch">
      <input type="checkbox" id="turnsOn">
      <span class="track"></span><span class="knob"></span>
    </label>
  </div>

  <div class="players" id="playerList"></div>
  <div class="addrow">
    <input id="playerInput" type="text" placeholder="Имя игрока" maxlength="24"
           autocomplete="off" autocapitalize="words" autocorrect="off"
           spellcheck="false" enterkeyhint="done" inputmode="text">
    <button class="btn" id="addPlayer">＋</button>
  </div>

  <div class="freshrow">
    <span id="freshText">Свежих вопросов: —</span>
    <button class="btn ghost sm" id="resetSeen">Сбросить историю</button>
  </div>

  <div class="actions">
    <button class="btn ghost" id="resetDeck">Начать заново</button>
    <button class="btn" id="closeSheet">Готово</button>
  </div>
</div>

<script>
/* ============================ Данные ============================ */
const CATEGORIES = [
  {id:"ice",    name:"Знакомство",     emoji:"🎈", color:"#27c2c9", soft:"rgba(39,194,201,.22)",  glow:"rgba(39,194,201,.35)"},

  {id:"fun",    name:"Весёлое",        emoji:"😄", color:"#ff6fa5", soft:"rgba(255,111,165,.22)", glow:"rgba(255,111,165,.35)"},
  {id:"value",  name:"Ценности",       emoji:"❤️", color:"#43c47b", soft:"rgba(67,196,123,.22)",  glow:"rgba(67,196,123,.35)"},
  {id:"past",   name:"Из прошлого",    emoji:"🧭", color:"#e6b84a", soft:"rgba(230,184,74,.22)",  glow:"rgba(230,184,74,.35)"},

  {id:"tastes", name:"Вкусы",          emoji:"🎧", color:"#d957c9", soft:"rgba(217,87,201,.22)",  glow:"rgba(217,87,201,.35)"},
  {id:"here",   name:"Здесь и сейчас", emoji:"🤝", color:"#2ec4b6", soft:"rgba(46,196,182,.22)",  glow:"rgba(46,196,182,.35)"},
  {id:"spicy",  name:"Поострее",       emoji:"🌶️", color:"#ff5252", soft:"rgba(255,82,82,.22)",   glow:"rgba(255,82,82,.35)"},
];

const QUESTIONS = {
  ice:[

/* ============================ Состояние ============================ */
const LS = "pobliche.v1";
const catById = id => CATEGORIES.find(c=>c.id===id);

let state = {
  active: CATEGORIES.map(c=>c.id), // выбранные категории
  order: [],        // перемешанный список {cat, i}
  pos: 0,           // текущая позиция
  players: [],
  turnsOn: false,
  turnIdx: 0,
  seen: {},         // показанные вопросы: ключ "cat:i" -> 1 (память между встречами)
  noRepeat: true,   // не повторять уже показанные
};

function save(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(LS));
    if(s && Array.isArray(s.order)) state = Object.assign(state, s);
  }catch(e){}
}

function buildPool(){
  const pool = [];
  state.active.forEach(cat=>{
    (QUESTIONS[cat]||[]).forEach((_,i)=>pool.push({cat,i}));
  });
  return pool;
}
function shuffle(arr){
  const a = arr.slice();
  for(let k=a.length-1;k>0;k--){
    const j = Math.floor(Math.random()*(k+1));
    [a[k],a[j]] = [a[j],a[k]];
  }
  return a;
}
const keyOf = it => it.cat + ":" + it.i;

function rebuildDeck(reset=true){
  const pool = buildPool();
  if(state.noRepeat){
    const fresh = shuffle(pool.filter(it => !state.seen[keyOf(it)]));
    const old   = shuffle(pool.filter(it =>  state.seen[keyOf(it)]));
    state.order = fresh.concat(old);        // свежие вопросы всегда впереди
  } else {
    state.order = shuffle(pool);
  }
  if(reset){ state.pos = 0; state.turnIdx = 0; }
  if(state.pos >= state.order.length) state.pos = Math.max(0, state.order.length-1);
  save();
}

/* ============================ Рендер ============================ */
const deckEl = document.getElementById("deck");
const turnEl = document.getElementById("turn");
const chipsEl = document.getElementById("chips");
const progressText = document.getElementById("progressText");
const progressBar = document.getElementById("progressBar");

function questionAt(pos){
  const item = state.order[pos];
  if(!item) return null;
  return {cat:item.cat, text:QUESTIONS[item.cat][item.i]};
}

function cardHTML(q, extraClass=""){
  if(!q){
    return `<div class="card ${extraClass}" style="--c:#a06bff">
      <div class="q"><div class="empty"><div class="big">🎉</div>
      Колода пройдена!<br>Жми «Начать заново» или 🔀.</div></div></div>`;
  }
  const c = catById(q.cat);
  return `<div class="card ${extraClass}" style="--c:${c.color}">
    <div class="top">
      <span class="cat"><span class="blob"></span>${c.emoji} ${c.name}</span>
      <span class="num">${state.pos+1} / ${state.order.length}</span>
    </div>
    <div class="q"><span>${q.text}</span></div>
    <div class="accent"></div>
    <div class="hint">смахни в сторону или жми →</div>
  </div>`;
}

function render(animate=false){
  // помечаем текущий вопрос показанным — чтобы не повторялся в следующий раз
  const curItem = state.order[state.pos];
  if(curItem && !state.seen[keyOf(curItem)]){ state.seen[keyOf(curItem)] = 1; save(); }

  // карточки сзади (для глубины колоды)
  const b2 = questionAt(state.pos+2);
  const b1 = questionAt(state.pos+1);
  const cur = questionAt(state.pos);
  let html = "";
  if(b2) html += cardHTML(b2, "behind2");
  if(b1) html += cardHTML(b1, "behind1");
  html += cardHTML(cur, animate ? "fade-enter top-card" : "top-card");
  deckEl.innerHTML = html;

  attachGestures(deckEl.querySelector(".top-card"));

  // прогресс
  const total = state.order.length;
  const shown = Math.min(state.pos+1, total);
  progressText.textContent = total ? `${Math.max(0,shown)} / ${total}` : "—";
  progressBar.style.width = total ? `${Math.max(0,shown)/total*100}%` : "0%";

  // чей ход
  renderTurn();
}

function renderTurn(){
  if(state.turnsOn && state.players.length){
    const name = state.players[state.turnIdx % state.players.length];
    turnEl.innerHTML = `Отвечает: <b>${escapeHtml(name)}</b>`;
  } else {
    turnEl.textContent = "";
  }
}

function renderChips(){
  chipsEl.innerHTML = "";
  // «Все»
  const all = document.createElement("button");
  const isAll = state.active.length === CATEGORIES.length;
  all.className = "chip";
  all.textContent = "Все";
  all.setAttribute("aria-pressed", isAll);
  all.onclick = ()=>{
    state.active = CATEGORIES.map(c=>c.id);
    rebuildDeck(true); renderChips(); render(true);
  };
  chipsEl.appendChild(all);

  CATEGORIES.forEach(c=>{
    const on = state.active.includes(c.id) && !isAll;
    const b = document.createElement("button");
    b.className = "chip";
    b.innerHTML = `${c.emoji} ${c.name}`;
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.style.setProperty("--c", c.color);
    b.style.setProperty("--c-soft", c.soft);
    b.style.setProperty("--c-glow", c.glow);
    b.onclick = ()=>{
      const wasAll = state.active.length === CATEGORIES.length;
      if(wasAll){ state.active = [c.id]; }       // из «все» -> только эта
      else if(on){
        state.active = state.active.filter(x=>x!==c.id);
        if(state.active.length===0) state.active = CATEGORIES.map(x=>x.id);
      } else {
        state.active.push(c.id);
      }
      rebuildDeck(true); renderChips(); render(true);
    };
    chipsEl.appendChild(b);
  });
}

function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

/* ============================ Навигация ============================ */
function haptic(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }

function nextCard(dir=1){
  if(state.pos < state.order.length){
    state.pos = Math.min(state.pos+1, state.order.length);
    if(state.turnsOn && state.players.length) state.turnIdx++;
    haptic(12);
  }
  save();
  render(true);
}
function prevCard(){
  if(state.pos > 0){
    state.pos--;
    if(state.turnsOn && state.players.length) state.turnIdx = Math.max(0, state.turnIdx-1);
    haptic(8);
    save(); render(true);
  }
}

document.getElementById("next").onclick = ()=>flingTop("up", ()=>nextCard());
document.getElementById("prev").onclick = prevCard;
document.getElementById("shuffle").onclick = ()=>{
  haptic([8,40,8]); rebuildDeck(true); render(true);
};

/* ============================ Жесты ============================ */
function attachGestures(card){
  if(!card) return;
  let sx=0, sy=0, dx=0, dy=0, dragging=false, startT=0;

  const down = (x,y)=>{ dragging=true; sx=x; sy=y; dx=0; dy=0; startT=Date.now();
    card.style.transition="none"; };
  const move = (x,y)=>{
    if(!dragging) return;
    dx=x-sx; dy=y-sy;
    const rot = dx/18;
    card.style.transform=`translate(${dx}px,${dy*0.4}px) rotate(${rot}deg)`;
    card.style.opacity = String(Math.max(.4, 1 - Math.abs(dx)/420));
  };
  const up = ()=>{
    if(!dragging) return;
    dragging=false;
    const dist=Math.abs(dx), fast=(Date.now()-startT)<260 && dist>60;
    card.style.transition="transform .32s cubic-bezier(.2,.8,.2,1), opacity .3s";
    if(dist>120 || fast){
      const out = dx>0 ? window.innerWidth : -window.innerWidth;
      card.style.transform=`translate(${out}px, ${dy*0.5}px) rotate(${dx/12}deg)`;
      card.style.opacity="0";
      setTimeout(()=>nextCard(dx>0?1:-1), 170);
    } else {
      card.style.transform=""; card.style.opacity="1";
    }
  };

  card.addEventListener("touchstart",e=>down(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
  card.addEventListener("touchmove", e=>{move(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
  card.addEventListener("touchend", up);

  card.addEventListener("mousedown",e=>{down(e.clientX,e.clientY);
    const mm=ev=>move(ev.clientX,ev.clientY);
    const mu=()=>{up(); window.removeEventListener("mousemove",mm); window.removeEventListener("mouseup",mu);};
    window.addEventListener("mousemove",mm); window.addEventListener("mouseup",mu);
  });
}

function flingTop(dir, cb){
  const card = deckEl.querySelector(".top-card");
  if(!card){ cb(); return; }
  card.style.transition="transform .28s ease, opacity .28s";
  card.style.transform = dir==="up" ? "translateY(-120%) rotate(-4deg)" : "translateX(120%)";
  card.style.opacity="0";
  setTimeout(cb, 150);
}

/* ============================ Лист настроек ============================ */
const scrim=document.getElementById("scrim"), sheet=document.getElementById("sheet");
function openSheet(){ updateFresh(); scrim.classList.add("show"); sheet.classList.add("show"); }
function closeSheet(){ scrim.classList.remove("show"); sheet.classList.remove("show"); }
document.getElementById("openSheet").onclick=openSheet;
document.getElementById("closeSheet").onclick=closeSheet;
scrim.onclick=closeSheet;

const turnsOn=document.getElementById("turnsOn");
turnsOn.onchange=()=>{ state.turnsOn=turnsOn.checked; save(); renderTurn(); };

// --- Память пройденного: не повторять между встречами ---
const noRepeatEl=document.getElementById("noRepeat");
const freshText=document.getElementById("freshText");
function updateFresh(){
  const pool=buildPool();
  const left=pool.filter(it=>!state.seen[keyOf(it)]).length;
  freshText.textContent = left>0
    ? `Свежих вопросов: ${left} из ${pool.length}`
    : `Все ${pool.length} пройдены — пойдут по кругу`;
}
noRepeatEl.onchange=()=>{
  state.noRepeat=noRepeatEl.checked;
  rebuildDeck(true); render(true); updateFresh();
};
document.getElementById("resetSeen").onclick=()=>{
  state.seen={}; haptic(20);
  rebuildDeck(true); render(true); updateFresh();
};

const playerList=document.getElementById("playerList");
const playerInput=document.getElementById("playerInput");
function renderPlayers(){
  playerList.innerHTML="";
  state.players.forEach((p,idx)=>{
    const t=document.createElement("div"); t.className="ptag";
    t.innerHTML=`<span>${escapeHtml(p)}</span>`;
    const b=document.createElement("button"); b.textContent="×";
    b.onclick=()=>{ state.players.splice(idx,1); save(); renderPlayers(); renderTurn(); };
    t.appendChild(b); playerList.appendChild(t);
  });
}
function addPlayer(){
  const v=playerInput.value.trim();
  if(!v) return;
  state.players.push(v); playerInput.value="";
  if(!state.turnsOn){ state.turnsOn=true; turnsOn.checked=true; }
  save(); renderPlayers(); renderTurn();
}
document.getElementById("addPlayer").onclick=addPlayer;
playerInput.addEventListener("keydown",e=>{ if(e.key==="Enter") addPlayer(); });

document.getElementById("resetDeck").onclick=()=>{
  rebuildDeck(true); render(true); closeSheet();
};

/* ============================ Клавиатура ============================ */
window.addEventListener("keydown",e=>{
  if(sheet.classList.contains("show")) return;
  if(e.key==="ArrowRight"||e.key===" "){ e.preventDefault(); flingTop("up",()=>nextCard()); }
  if(e.key==="ArrowLeft"){ prevCard(); }
});

/* ============================ Старт ============================ */
function init(){
  load();
  if(!state.order.length) rebuildDeck(true);
  turnsOn.checked=state.turnsOn;
  noRepeatEl.checked=state.noRepeat;
  renderChips(); renderPlayers(); render(false); updateFresh();
}
init();

/* ============================ Защита жестов на телефоне ============================ */
// гасим «резиновый» скролл страницы и случайный пинч-зум,
// но не мешаем горизонтальной ленте категорий и листу настроек
document.addEventListener("touchmove",(e)=>{
  if(e.touches.length>1){ e.preventDefault(); return; }     // пинч
  if(!e.target.closest(".chips, .sheet")) e.preventDefault(); // оттяжка/буфер
},{passive:false});
document.addEventListener("gesturestart",(e)=>e.preventDefault()); // iOS pinch

/* ============================ Service Worker ============================ */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
